quarkus.application.name=medbox
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:data/medbox.db?busy_timeout=5000
# SQLite 为文件级锁，连接池只能用单连接，否则并发写入会 SQLITE_BUSY
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=1
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
quarkus.hibernate-orm.database.generation=update

quarkus.log.category."com.community.medbox".level=INFO

# 启动时写入演示数据（工作人员/居民/预约），测试环境关闭
medbox.seed=true

%test.quarkus.datasource.jdbc.url=jdbc:sqlite:target/test-medbox.db?busy_timeout=5000
%test.quarkus.datasource.jdbc.min-size=1
%test.quarkus.datasource.jdbc.max-size=1
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.medbox.seed=false
