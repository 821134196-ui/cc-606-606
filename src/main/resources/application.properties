# ===== 数据源：SQLite（本地文件，随项目目录）=====
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:medreturn.db
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.min-size=1

# ===== Hibernate ORM =====
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# ===== HTTP / 前端静态资源（Svelte 构建产物）=====
quarkus.http.port=8080
quarkus.http.static-resources.index-page=index.html
quarkus.http.enable-compression=true

# ===== 测试：SQLite 共享内存库，不落盘 =====
%test.quarkus.datasource.jdbc.url=jdbc:sqlite:file:medtest?mode=memory&cache=shared
